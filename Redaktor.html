<html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIS HELPER Редактор правил</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            background-attachment: fixed;
            background-size: cover;
            min-height: 100vh;
            color: #f8fafc;
        }
        .container {
            background: rgba(20, 25, 40, 0.4);
            padding: 35px;
            border-radius: 28px;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1), 0 10px 30px -10px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        h1 {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 35px;
            font-weight: 700;
            letter-spacing: 0.5px;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #94a3b8;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #2d3a52;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            background-color: #1a2435;
            color: #e2e8f0;
            transition: all 0.2s;
        }
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #6366f1;
            background-color: #182130;
        }
        ::placeholder {
            color: #64748b;
        }
        button {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            padding: 13px 32px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            margin-right: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }
        .result {
            margin-top: 35px;
            padding: 24px;
            background-color: #1a2435;
            border-radius: 10px;
            font-family: 'Consolas', 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            word-break: break-all;
            overflow-wrap: break-word;
            border: 1px solid #2d3a52;
            font-size: 14px;
            line-height: 1.6;
        }

        #codeOutput {
            white-space: pre-wrap;
            word-break: break-all;
            overflow-wrap: break-word;
        }
        .result-title {
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 15px;
            font-size: 13px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Создание правил || Редактор правил</h1>
        
        <div class="form-group">
            <label for="searchInput">Список правил (каждое правило на новой строке):</label>
            <textarea id="searchInput" placeholder="дм - 60 мин дмг"></textarea>
        </div>

        <div class="form-group">
            <label for="categoryInput">Категория:</label>
            <input type="text" id="categoryInput" placeholder="Название">
        </div>

        <button id="generateBtn">Создать код</button>
        <button id="copyBtn" style="background-color: #28a745;">Скопировать</button>

        <div class="result" id="result" style="display: none;">
            <pre id="codeOutput"></pre>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const generateBtn = document.getElementById('generateBtn');
            const copyBtn = document.getElementById('copyBtn');
            const searchInput = document.getElementById('searchInput');
            const categoryInput = document.getElementById('categoryInput');
            const codeOutput = document.getElementById('codeOutput');
            
            generateBtn.addEventListener('click', generateCode);
            copyBtn.addEventListener('click', copyToClipboard);

            // ✅ Автофокус на первое поле при загрузке
            searchInput.focus();

            // ✅ Обработка Enter в поле категории
            categoryInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') generateCode();
            });

            function generateCode() {
                const searchValue = searchInput.value.trim();
                const categoryValue = categoryInput.value.trim();
                
                if (!searchValue || !categoryValue) {
                    alert('Заполните все поля!');
                    return;
                }

                // Разбиваем на строки и парсим каждую
                const lines = searchValue.split('\n').filter(line => line.trim());
                const items = [];

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    const separatorIndex = line.indexOf(' - ');
                    
                    if (separatorIndex === -1) {
                        alert(`Ошибка в строке ${i+1}: используйте формат Ответ - Наказание`);
                        return;
                    }

                    const answer = line.substring(0, separatorIndex).trim();
                    const punishment = line.substring(separatorIndex + 3).trim();
                    items.push(`["${answer}", "${punishment}"]`);
                }

                // ✅ Исправлена лишняя запятая в конце массива
                const code = `{
    category: "${categoryValue}",
    items: [
        ${items.join(',\n        ')}
    ]
}`;

                codeOutput.textContent = code;
                document.getElementById('result').style.display = 'block';
            }

            function copyToClipboard() {
                const code = codeOutput.textContent;
                if (!code) {
                    alert('Сначала сгенерируйте код!');
                    return;
                }

                navigator.clipboard.writeText(code).then(() => {
                    alert('✅ Код скопирован в буфер обмена!');
                }).catch(err => {
                    alert('❌ Ошибка копирования');
                });
            }
        });

    </script>

</body></html>
