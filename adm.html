    <style>
        /* --- 1. ПЕРЕМЕННЫЕ И ТЕМЫ (2026 EDITION) --- */
        :root { 
            --primary: #6366f1; 
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.6); 
            --bg-grad-1: #0f172a; 
            --bg-grad-2: #312e81; 
            --bg-grad-3: #172554;
            --card-bg: rgba(20, 25, 40, 0.5); 
            --card-hover: rgba(30, 40, 60, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1), 0 10px 30px -10px rgba(0,0,0,0.5);
            --text-main: #f8fafc; 
            --text-muted: #94a3b8; 
            --warning: #fbbf24;
            --warning-bg: rgba(251, 191, 36, 0.15);
            --danger: #f43f5e; 
            --danger-bg: rgba(244, 63, 94, 0.15); 
        }

        [data-theme="light"] { 
            --bg-grad-1: #f1f5f9; --bg-grad-2: #e2e8f0; --bg-grad-3: #cbd5e1;
            --card-bg: rgba(255, 255, 255, 0.7); 
            --card-hover: #ffffff;
            --card-border: rgba(0, 0, 0, 0.05);
            --card-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.8), 0 10px 30px -10px rgba(0,0,0,0.1);
            --text-main: #0f172a; --text-muted: #64748b; 
            --primary-glow: rgba(99, 102, 241, 0.25); 
            --warning: #d97706;
            --warning-bg: rgba(217, 119, 6, 0.1);
        }

        [data-theme="black"] { 
            --bg-grad-1: #000000; --bg-grad-2: #000000; --bg-grad-3: #050505;
            --card-bg: rgba(10, 10, 10, 0.8); 
            --card-hover: #1a1a1a;
            --text-main: #ffffff; --text-muted: #737373; 
        }

        /* --- 2. СКРЫВАЕМ ПОЛОСУ ПРОКРУТКИ --- */
        ::-webkit-scrollbar { width: 0; background: transparent; }
        html { scrollbar-width: none; }
        body { -ms-overflow-style: none; }

        /* --- 3. АНИМИРОВАННЫЙ ФОН --- */
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top, var(--bg-grad-1), var(--bg-grad-2));
            background-attachment: fixed;
            background-size: cover;
            color: var(--text-main); 
            margin: 0; padding: 0; 
            min-height: 100vh; 
            transition: color 0.5s ease; 
            position: relative;
            display: none; /* Скрыто до проверки авторизации */
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); filter: blur(5px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        /* --- 4. ШАПКА И ТЕКСТ --- */
        .sys-header { display: flex; justify-content: center; align-items: center; margin-bottom: 30px; text-align: center; }
        .sys-title { margin: 0; font-weight: 900; font-size: 3rem; background: linear-gradient(90deg, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; line-height: 1; text-transform: uppercase; }
        [data-theme="light"] .sys-title { background: linear-gradient(90deg, #475569, #0f172a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .subtitle { color: var(--text-muted); font-size: 0.95rem; font-weight: 500; margin-top: 15px; }

        kbd {
            background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2); font-family: monospace;
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.3); font-weight: bold;
        }
        [data-theme="light"] kbd { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.1); box-shadow: inset 0 -2px 0 rgba(0,0,0,0.1); }

        /* Кнопка Назад */
        .back-btn {
            background: var(--card-bg); color: var(--text-main);
            border: 1px solid var(--card-border); padding: 12px 24px;
            border-radius: 14px; cursor: pointer; font-weight: 700;
            transition: all 0.3s; margin-bottom: 30px; align-self: flex-start;
            backdrop-filter: blur(10px); box-shadow: var(--card-shadow);
        }
        .back-btn:hover { background: var(--primary); border-color: var(--primary); transform: translateX(-5px); color: white; }

        /* --- 5. КАТЕГОРИИ И ПРАВИЛА --- */
        .category-block { 
            margin-bottom: 50px; 
            background: rgba(0,0,0,0.1);
            padding: 30px;
            border-radius: 32px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .category-title {
            color: var(--text-main);
            font-size: 1.4rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .category-title::before {
            content: ""; display: block; width: 12px; height: 12px;
            background: var(--primary); border-radius: 50%;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .rule-row {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); margin-bottom: 12px;
            border-radius: 16px; padding: 18px 24px;
            border: 1px solid var(--card-border); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(15px); box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }
        
        .rule-row:hover {
            transform: translateY(-3px) scale(1.01);
            background: var(--card-hover);
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 15px 30px -10px rgba(0,0,0,0.4), 0 0 35px var(--primary-glow);
            z-index: 10; position: relative;
        }

        .rule-name { flex: 1; padding-right: 20px; font-weight: 600; line-height: 1.5; font-size: 0.95rem; }

        .rule-punishment {
            flex: 0 0 auto; text-align: right; color: var(--warning);
            font-size: 0.85rem; font-weight: 800; background: var(--warning-bg);
            padding: 8px 16px; border-radius: 10px; white-space: pre-wrap; max-width: 40%;
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        .severe {
            color: var(--danger); background: var(--danger-bg);
            border-color: rgba(244, 63, 94, 0.3);
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.2);
        }

        /* --- 6. ПОИСК --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 1000; justify-content: center; align-items: flex-start; padding-top: 80px;
            animation: fadeIn 0.2s;
        }

        .modal-content {
            background: var(--card-bg); width: 90%; max-width: 700px;
            border-radius: 24px; border: 1px solid var(--card-border);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.1), 0 0 50px var(--primary-glow);
            overflow: hidden; display: flex; flex-direction: column; max-height: 75vh;
            backdrop-filter: blur(25px);
        }

        .search-header { padding: 25px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--card-border); position: relative;}
        
        input#search-input {
            width: 100%; background: transparent; border: none; color: var(--text-main);
            font-size: 1.5rem; outline: none; font-family: 'Inter', sans-serif; font-weight: 800;
        }
        input#search-input::placeholder { color: var(--text-muted); opacity: 0.5; font-weight: 600;}

        .search-results { overflow-y: auto; padding: 10px; }

        .result-item {
            padding: 18px 25px; border-radius: 16px; margin-bottom: 5px;
            cursor: pointer; transition: 0.2s; border: 1px solid transparent;
        }
        .result-item:hover { background: rgba(255,255,255,0.05); border-color: var(--card-border); transform: translateX(5px);}
        .result-category { font-size: 0.7rem; color: var(--primary); text-transform: uppercase; margin-bottom: 6px; font-weight: 800; letter-spacing: 1px;}
        
        .result-highlight { background: rgba(99, 102, 241, 0.4); color: #fff; border-radius: 4px; padding: 0 4px; }
        [data-theme="light"] .result-highlight { color: #000; }

        .empty-state { padding: 40px; text-align: center; color: var(--text-muted); font-weight: 600; }
        
        /* Кнопка FAB */
        .fab-search {
            position: fixed; bottom: 40px; right: 40px; width: 65px; height: 65px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px var(--primary-glow); cursor: pointer; z-index: 900;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); color: #fff; border: 1px solid rgba(255,255,255,0.2);
        }
        .fab-search:hover { transform: scale(1.1) translateY(-5px); box-shadow: 0 15px 40px var(--primary-glow); }
        .fab-icon { font-size: 26px; }

        /* --- 7. МОБИЛЬНАЯ ОПТИМИЗАЦИЯ (NO LAG) --- */
        @media screen and (max-width: 768px) {
            body {
                animation: none !important;
            }
            
            /* Отключаем тяжелый блюр и тени */
            .back-btn, .rule-row, .modal-content, .search-header, .fab-search {
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                box-shadow: none !important;
                transform: none !important;
            }
            
            /* Делаем фон плашек непрозрачным для читаемости */
            .rule-row { background: var(--bg-grad-3) !important; border: 1px solid var(--card-border) !important; }
            .modal-content { background: var(--bg-grad-2) !important; }
            .category-block { background: transparent !important; border: none !important; padding: 10px 0 !important; }
        }
    </style>
</head>

<script>
    // Версия должна совпадать с index.html
    const SESSION_VERSION = "1.3"; 

    (function() {
        const savedAuth = localStorage.getItem('authData');
        
        if (!savedAuth) {
            window.location.href = 'index.html'; 
            return;
        }
        
        try {
            const authData = JSON.parse(savedAuth);
            const now = new Date().getTime();
            
            // Сверяем версию и время
            if (authData.version !== SESSION_VERSION || now > authData.expiry) {
                localStorage.removeItem('authData');
                window.location.href = 'index.html';
                return;
            }
        } catch (e) {
            localStorage.removeItem('authData');
            window.location.href = 'index.html';
            return;
        }

        // Показываем страницу
        document.body.style.display = 'block';

        // Загрузка темы
        const savedTheme = localStorage.getItem('siteTheme') || 'default';
        document.body.setAttribute('data-theme', savedTheme);

        // Загрузка цветов и фона из localStorage (синхронизация с index.html)
        const savedColors = localStorage.getItem('siteColors');
        if (savedColors) {
            try {
                const c = JSON.parse(savedColors);
                const root = document.documentElement;
                if(c.primary) root.style.setProperty('--primary', c.primary);
                if(c.bg1) root.style.setProperty('--bg-grad-1', c.bg1);
                if(c.bg2) root.style.setProperty('--bg-grad-2', c.bg2);
                if(c.bg3) root.style.setProperty('--bg-grad-3', c.bg3);
            } catch(e) {}
        }
        const savedBg = localStorage.getItem('siteBg');
        if (savedBg) {
            try {
                const bg = JSON.parse(savedBg);
                if (bg.image) {
                    document.body.style.backgroundImage = `url(${bg.image})`;
                    document.body.style.backgroundSize = bg.size;
                    document.body.style.backgroundPosition = bg.pos;
                    document.body.style.backgroundRepeat = bg.repeat;
                }
            } catch(e) {}
        }

        const isGlow = localStorage.getItem('showGlow') !== 'false';
        if (!isGlow) {
            document.body.style.setProperty('--primary-glow', 'transparent');
        } else {
            // Установка пустого значения удаляет инлайн-свойство, даже если оно было с !important
            document.body.style.setProperty('--primary-glow', '');
        }

        // --- АВТОМАТИЧЕСКИЙ ВЫБРОС (Real-time Check) ---
        setInterval(() => {
            try {
                const checkAuth = JSON.parse(localStorage.getItem('authData'));
                if (!checkAuth || new Date().getTime() > checkAuth.expiry) {
                    localStorage.removeItem('authData');
                    window.location.href = 'index.html';
                }
            } catch (e) { window.location.href = 'index.html'; }
        }, 2000); // Проверка каждые 2 секунды
    })();
</script>

        ["Слив админки / моментальный уход / жесткие нарушения", "Бан / ЧС Администрации"],
        ["Неуважительное отношение к игрокам в игре и за её пределами", "ЗАПРЕЩЕНО"],
        ["Вмешательство администратора в РП процесс (админ", "nonRP персонаж) - ЗАПРЕЩЕНО"],
        ["Использование админки и команд в личных целях", "ЗАПРЕЩЕНО"],
        ["Участие администрации в слетах имущества", "ЗАПРЕЩЕНО"],
        ["Владение любым имуществом, кроме транспорта (для 1-4 лвл)", "ЗАПРЕЩЕНО"],
        ["Игра с твинков на своем сервере", "ЗАПРЕЩЕНО (на других серверах - только с одобрения ГА)"],
        ["Провокационные реакции от админов на форуме (лайк, смех на жалобу)", "ЗАПРЕЩЕНО"],
        ["Превышение нормы АФК / уход в АФК при большой очереди в репорт", "ЗАПРЕЩЕНО"],
        ["Прохождение праздничных квестов", "Разрешено только в рабочих целях и при отсутствии репорта"],
        ["Выпрашивание поощрений или вирт у игроков", "ЗАПРЕЩЕНО"],
        ["Выдача ХП, машин, денег игрокам в обход РП режима", "Администратор вправе отказать"],
        ["Срок наказания игрока по жалобе", "Максимум 3 дня с момента нарушения"],
        ["Удаление/отсутствие доказательств на наказание игрока", "ЗАПРЕЩЕНО (администрация обязана хранить опровержение весь срок подачи жалобы)"]
    ]
       },
    ];

    // ГЕНЕРАЦИЯ СПИСКА
    const container = document.getElementById('rules-container');
    
    rulesData.forEach(cat => {
        const catDiv = document.createElement('div');
        catDiv.className = 'category-block';
        
        const title = document.createElement('div');
        title.className = 'category-title';
        title.textContent = cat.category;
        catDiv.appendChild(title);

        cat.items.forEach(item => {
            const row = document.createElement('div');
            row.className = 'rule-row';
            
            const isSevere = item[1].toLowerCase().includes('2000') || 
                             item[1].toLowerCase().includes('бан') || 
                             item[1].toLowerCase().includes('чс') ||
                             item[1].toLowerCase().includes('снятие');
                             
            const punishClass = isSevere ? 'rule-punishment severe' : 'rule-punishment';

            row.innerHTML = `
                <div class="rule-name">${item[0]}</div>
                <div class="${punishClass}">${item[1]}</div>
            `;
            catDiv.appendChild(row);
        });

        container.appendChild(catDiv);
    });

    // ПОИСК
    const modal = document.getElementById('search-modal');
    const input = document.getElementById('search-input');
    const resultsContainer = document.getElementById('search-results');

    function openSearch() {
        modal.style.display = 'flex';
        input.focus();
    }

    function performSearch(query) {
        resultsContainer.innerHTML = '';
        if (!query) {
            resultsContainer.innerHTML = '<div class="empty-state">Введите запрос для поиска...</div>';
            return;
        }

        const lowerQuery = query.toLowerCase();
        let count = 0;

        rulesData.forEach(cat => {
            cat.items.forEach(item => {
                const name = item[0];
                const punish = item[1];
                
                if (name.toLowerCase().includes(lowerQuery)) {
                    const el = document.createElement('div');
                    el.className = 'result-item';
                    
                    const highlight = (text) => {
                        const regex = new RegExp(`(${query})`, 'gi');
                        return text.replace(regex, '<span class="result-highlight">$1</span>');
                    };

                    el.innerHTML = `
                        <div class="result-category">${cat.category}</div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span style="font-weight:600; margin-right:15px; font-size: 0.95rem;">${highlight(name)}</span>
                            <span style="color:var(--warning); font-size:0.85rem; font-weight:800;">${punish}</span>
                        </div>
                    `;
                    
                    el.onclick = () => {
                        modal.style.display = 'none';
                        const elements = document.querySelectorAll('.rule-name');
                        for (let elem of elements) {
                            if (elem.innerText === name) {
                                elem.scrollIntoView({behavior: "smooth", block: "center"});
                                elem.parentElement.style.borderColor = 'var(--primary)';
                                elem.parentElement.style.boxShadow = '0 0 30px var(--primary-glow)';
                                setTimeout(() => {
                                    elem.parentElement.style.borderColor = 'rgba(255,255,255,0.08)';
                                    elem.parentElement.style.boxShadow = 'inset 0 1px 1px rgba(255, 255, 255, 0.05)';
                                }, 2000);
                                break;
                            }
                        }
                    };

                    resultsContainer.appendChild(el);
                    count++;
                }
            });
        });

        if (count === 0) {
            resultsContainer.innerHTML = '<div class="empty-state">По вашему запросу ничего не найдено</div>';
        }
    }

    input.addEventListener('input', (e) => performSearch(e.target.value));

    // Hotkeys
    document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'а' || e.key === 'F')) {
            e.preventDefault();
            openSearch();
        }
        if (e.key === 'Escape') {
            modal.style.display = 'none';
            input.value = '';
            performSearch('');
        }
    });

    modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.style.display = 'none';
    });
</script>

</body>
</html>
